<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANGRU KALASIN — LIVE MONITOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Kanit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; width: 100vw; height: 100vh; overflow: hidden; font-family: 'Kanit', sans-serif; display: flex; align-items: center; justify-content: center; }
        
        #idle { position: fixed; inset: 0; background: #000; z-index: 10; display: flex; align-items: flex-end; justify-content: flex-end; padding: 18px 22px; transition: opacity 0.8s ease; }
        #idle.hidden { opacity: 0; pointer-events: none; }
        .live-badge { display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.25); font-size: 0.72rem; font-family: 'Orbitron', monospace; letter-spacing: 2px; }
        .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #ff3b3b; animation: blink 1.4s ease-in-out infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        #card { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; z-index: 20; }
        #card.show { opacity: 1; pointer-events: auto; }

        /* ปรับรูปให้ใหญ่และชัดเต็มที่ */
        .avatar-ring { width: 400px; height: 400px; border-radius: 20px; border: 8px solid #ff6a00; box-shadow: 0 0 50px rgba(255,106,0,0.6); overflow: hidden; margin-bottom: 30px; background: #111; }
        .avatar-ring img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
        .avatar-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 8rem; }

        .cust-name { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 3rem; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.4); margin-bottom: 10px; }
        .tip-amount { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 8rem; color: #ff6a00; text-shadow: 0 0 30px rgba(255,106,0,0.9); animation: amountPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) forwards; }
        .cust-msg { font-family: 'Kanit', sans-serif; font-size: 2rem; font-weight: 600; color: #ff9a3c; margin-top: 10px; }
        
        .progress-wrap { position: fixed; bottom: 0; left: 0; right: 0; height: 8px; background: rgba(255,255,255,0.1); z-index: 30; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ff6a00, #ff2d78); width: 100%; transform-origin: left; transition: transform linear; }
    </style>
</head>
<body>

<div id="idle"><div class="live-badge"><div class="live-dot"></div>LIVE</div></div>

<div id="card">
    <div class="avatar-ring">
        <img id="c-photo" src="" alt="" style="display:none;">
        <div class="avatar-placeholder" id="c-placeholder">🎉</div>
    </div>
    <div class="cust-name" id="c-name">—</div>
    <div class="tip-amount" id="c-amount">0.-</div>
    <div class="cust-msg" id="c-msg">—</div>
</div>

<div class="progress-wrap" id="prog-wrap" style="display:none;"><div class="progress-bar" id="prog-bar"></div></div>

<script>
    const fbConfig = {
        apiKey: "AIzaSyDgpZ0T2E7yO7EjnfVwZzesKw0eNJC7kJc",
        authDomain: "bangru-kalasin.firebaseapp.com",
        databaseURL: "https://bangru-kalasin-default-rtdb.firebaseio.com",
        projectId: "bangru-kalasin",
        storageBucket: "bangru-kalasin.firebasestorage.app",
        messagingSenderId: "150447340465",
        appId: "1:150447340465:web:d39c310e5e32030aea1b90"
    };
    firebase.initializeApp(fbConfig);
    const db = firebase.database();

    const SHOW_MS = 40000; 
    let queue = [];
    let isShowing = false;
    const seenKeys = new Set();

    db.ref('live_tips').on('child_changed', snap => {
        const d = snap.val();
        if (!d || d.status !== 'approved' || seenKeys.has(snap.key)) return;
        seenKeys.add(snap.key);
        queue.push(d);
        if (!isShowing) processQueue();
    });

    function processQueue() {
        if (queue.length === 0) return (isShowing = false);
        showTip(queue.shift());
    }

    function showTip(d) {
        isShowing = true;
        document.getElementById('c-name').textContent = d.name || 'FC BANGRU';
        document.getElementById('c-amount').textContent = (Number(d.amount)||0).toLocaleString() + '.-';
        document.getElementById('c-msg').textContent = d.message || '';
        
        const photo = document.getElementById('c-photo');
        const ph = document.getElementById('c-placeholder');
        if (d.photo && d.photo.startsWith('data:image')) {
            photo.src = d.photo; photo.style.display = 'block'; ph.style.display = 'none';
        } else {
            photo.style.display = 'none'; ph.style.display = 'flex';
        }

        document.getElementById('idle').classList.add('hidden');
        document.getElementById('card').classList.add('show');
        document.getElementById('prog-wrap').style.display = 'block';
        
        const bar = document.getElementById('prog-bar');
        bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)';
        setTimeout(() => {
            bar.style.transition = `transform ${SHOW_MS}ms linear`;
            bar.style.transform = 'scaleX(0)';
        }, 50);

        setTimeout(() => {
            document.getElementById('card').classList.remove('show');
            document.getElementById('prog-wrap').style.display = 'none';
            setTimeout(() => {
                document.getElementById('idle').classList.remove('hidden');
                processQueue();
            }, 500);
        }, SHOW_MS);
    }
</script>
</body>
</html>
